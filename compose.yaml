services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: adytus
      POSTGRES_PASSWORD: adytus
      POSTGRES_DB: adytus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # S3-compatible storage (MinIO no longer publishes images on Docker Hub).
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes:
      - s3data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Local stand-in for OpenRouter. Pull the model once with:
  #   docker-compose exec ollama ollama pull gemma3:270m
  #   docker-compose exec ollama ollama pull qwen2.5vl:3b   # vision
  #   docker-compose exec ollama ollama pull qwen3-vl:4b    # vision + tools
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollamadata:/root/.ollama]
    environment:
      # Ollama's default window is 4096 and its OpenAI-compatible API can't
      # change it per request; prompts over it are cut from the front without
      # an error. Keep this equal to context_tokens in models.ollama.json.
      OLLAMA_CONTEXT_LENGTH: "16384"
      # Keep two models resident instead of swapping on each request.
      OLLAMA_MAX_LOADED_MODELS: "2"

  # Web search for the search tool. Bound to localhost: only the API uses it.
  searxng:
    image: searxng/searxng:latest
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-change-me}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  pgdata:
  s3data:
  ollamadata:
