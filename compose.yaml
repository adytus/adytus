services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: adytus
      POSTGRES_PASSWORD: adytus
      POSTGRES_DB: adytus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # S3-compatible storage (MinIO no longer publishes images on Docker Hub).
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes:
      - s3data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Local stand-in for OpenRouter. Pull the model once with:
  #   docker-compose exec ollama ollama pull gemma3:270m
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollamadata:/root/.ollama]

volumes:
  pgdata:
  s3data:
  ollamadata:
