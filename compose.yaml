services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: adytus
      POSTGRES_PASSWORD: adytus
      POSTGRES_DB: adytus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: adytus
      MINIO_ROOT_PASSWORD: adytus-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
